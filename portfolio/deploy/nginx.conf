server {
  listen 80;
  server_name yourdomain.com www.yourdomain.com;
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2;
  server_name yourdomain.com www.yourdomain.com;
  ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
  client_max_body_size 2m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  location /api/ { limit_req zone=api burst=20 nodelay; proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
  location /_next/static/ { proxy_pass http://127.0.0.1:3000; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; proxy_set_header X-Real-IP $remote_addr; }
}
